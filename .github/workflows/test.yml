name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lucene 10 (via datahike) is class version 65: the runner default JDK 17 cannot load it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
      # Without a Wasmtime binary and a cljw module the sandbox runtime tests
      # skip; kaocha's output capture hides their SKIPPED lines, so say it here.
      - name: cljw runtime
        run: |
          if [ -z "${HIVE_WASMTIME:-}${HIVE_CLJW_WASM:-}" ]; then
            echo "::warning title=cljw runtime absent::HIVE_WASMTIME and HIVE_CLJW_WASM are unset: the sandbox runtime tests (deftest-runtime, test/hive_dvergr/sandbox_test.clj) are SKIPPED. scripts/verify-sandbox.sh runs them against a real runtime."
            echo "cljw runtime absent: sandbox runtime tests SKIPPED (set HIVE_WASMTIME and HIVE_CLJW_WASM)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: clojure -M:test

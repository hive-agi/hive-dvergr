name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # lucene 10 (via datahike) is class version 65: the runner default JDK 17 cannot load it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.7.1681
      # Caches the resolved dependency tree, keyed on the files that declare it.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - run: clojure -M:test
